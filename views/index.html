<!DOCTYPE html>

<html>
   <head>
      <title>File Metadata Microservice</title>
      <link rel="shortcut icon" href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png" type="image/x-icon"/>
      <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
      <link href="style.css" rel="stylesheet" type="text/css">
   </head>

   <body>
    <h1>File Metadata Microservice</h1>
    <p>Upload a file to retrieve its name, media type, and size in bytes.</p>
    <hr />
    <div class="container">
      <h2>Example Usage:</h2>
      <ul>
        <li><code>POST /api/fileanalyse</code> with a multipart file field named <code>upfile</code></li>
      </ul>

      <form action="/api/fileanalyse" method="POST" enctype="multipart/form-data">
        <label for="upfile">Choose a file</label>
        <input id="upfile" type="file" name="upfile" required>
        <button type="submit">Upload File</button>
      </form>
    </div>
    <div class="footer">
      <p>Other API challenge endpoints remain available.</p>
    </div>
  </body>
</html>
