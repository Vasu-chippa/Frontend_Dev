<!DOCTYPE html>

<html>
   <head>
      <title>Metric-Imperial Converter</title>
      <link rel="shortcut icon" href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png" type="image/x-icon"/>
      <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
      <link href="style.css" rel="stylesheet" type="text/css">
   </head>

   <body>
    <h1>Metric-Imperial Converter</h1>
    <p>Convert volumes, distances, and weights using the API.</p>
    <hr />
    <div class="container">
      <h2>Example Usage:</h2>
      <ul>
        <li><a href="/api/convert?input=10L">10L to gallons</a></li>
        <li><a href="/api/convert?input=1%2F2gal">1/2 gallon to liters</a></li>
        <li><code>GET /api/convert?input=numberUnit</code></li>
      </ul>

      <form action="/api/convert" method="GET">
        <label for="input">Value and unit (gal, L, mi, km, lbs, kg)</label>
        <input id="input" type="text" name="input" placeholder="10L" required>
        <button type="submit">Convert</button>
      </form>
    </div>
    <div class="footer">
      <p>Fractions and decimals are supported. Example: <code>2.5/6kg</code>.</p>
    </div>
  </body>
</html>
